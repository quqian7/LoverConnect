name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache release keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: app/lc.keystore
          key: lc-release-keystore-v1

      - name: Generate release keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore app/lc.keystore \
            -storepass limerence614 -alias loverconnect -keypass limerence614 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LoverConnect,O=Lime,C=CN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: lc.keystore
          KEYSTORE_STOREPASS: limerence614
          KEYSTORE_ALIAS: loverconnect
          KEYSTORE_KEYPASS: limerence614
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loverconnect-release
          path: app/build/outputs/apk/release/app-release.apk
